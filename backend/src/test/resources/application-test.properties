# Test profile - uses H2 in-memory (isolated, never touches the file DB)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
# keep create-drop for tests so each run starts clean
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

jwt.secret=test-secret-key-32-chars-long-xyz123
jwt.expiration=86400000

upload.path=./test-uploads

async.pool.core-size=1
async.pool.max-size=2
async.pool.queue-capacity=10

ai.service.url=http://localhost:5001

spring.h2.console.enabled=false
