# ── DataSource (Railway PostgreSQL) ───────────────────────────────────────────
# Railway injects DATABASE_URL in the form postgresql://user:password@host:port/db.
# Prefixing that with "jdbc:" and embedding credentials in the URL can trip up
# the pgjdbc URL parser (it has been observed mis-parsing the userinfo section
# as part of the host, leading to UnknownHostException). Building the JDBC URL
# explicitly from the individual PG* variables Railway also provides, and
# supplying username/password separately, avoids that failure mode entirely.
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=require
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# PostgreSQL SSL Configuration - Railway uses SSL by default
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.jdbc.fetch_size=50

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ── File Upload ───────────────────────────────────────────────────────────────
upload.path=${UPLOAD_PATH:/app/uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Async Thread Pool ─────────────────────────────────────────────────────────
async.pool.core-size=2
async.pool.max-size=10
async.pool.queue-capacity=500

# ── AI Service ────────────────────────────────────────────────────────────────
ai.service.url=${AI_SERVICE_URL}

# ── Google OAuth ──────────────────────────────────────────────────────────────
google.client.id=${GOOGLE_CLIENT_ID}
