# ── DataSource (Railway PostgreSQL) ───────────────────────────────────────────


# Railway injects individual PG* variables when Postgres plugin is linked.
# These are the most reliable — use them directly to build the JDBC URL.
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=require
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=5

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ── File Upload ───────────────────────────────────────────────────────────────
upload.path=${UPLOAD_PATH:/app/uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Async Thread Pool ─────────────────────────────────────────────────────────
async.pool.core-size=2
async.pool.max-size=10
async.pool.queue-capacity=500

# ── AI Service ────────────────────────────────────────────────────────────────
ai.service.url=${AI_SERVICE_URL:http://localhost:5001}

# ── Google OAuth ──────────────────────────────────────────────────────────────
google.client.id=${GOOGLE_CLIENT_ID:}
