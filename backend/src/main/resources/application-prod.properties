# ── DataSource (Railway MySQL) ────────────────────────────────────────────────
# Railway injects MYSQL_URL in the form mysql://user:password@host:port/db.
# Building the JDBC URL explicitly from the individual MYSQL* variables Railway
# also provides, and supplying username/password separately, avoids issues
# with the JDBC URL parser mis-handling embedded credentials.
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# MySQL Connection Configuration
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.jdbc.fetch_size=50

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ── File Upload ───────────────────────────────────────────────────────────────
upload.path=${UPLOAD_PATH:/app/uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Async Thread Pool ─────────────────────────────────────────────────────────
async.pool.core-size=2
async.pool.max-size=10
async.pool.queue-capacity=500

# ── AI Service ────────────────────────────────────────────────────────────────
ai.service.url=${AI_SERVICE_URL}

# ── Google OAuth ──────────────────────────────────────────────────────────────
google.client.id=${GOOGLE_CLIENT_ID}
